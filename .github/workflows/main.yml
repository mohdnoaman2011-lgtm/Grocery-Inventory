name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # المشروع لا يحتوي مجلدات المنصات، فتُنشأ هنا إن لم تكن موجودة
      - name: Create platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name inventory_app --org com.example
          fi

      # صلاحية البصمة + دعم زر الرجوع التنبؤي (Android 14+) + نشاط يدعم نافذة البصمة
      - name: Configure Android
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q USE_BIOMETRIC "$MANIFEST"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n    <application android:enableOnBackInvokedCallback="true"/' "$MANIFEST"
          fi
          # صلاحية الكاميرا لمسح الباركود
          grep -q 'permission.CAMERA' "$MANIFEST" || sed -i '0,/<application/s//<uses-permission android:name="android.permission.CAMERA"\/>\n    <application/' "$MANIFEST"
          find android/app/src/main -name 'MainActivity.*' -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} +
          # local_auth تحتاج سمة AppCompat للنشاط وإلا فشلت نافذة البصمة بصمت
          find android/app/src/main/res -name styles.xml -exec sed -i \
            -e 's#parent="@android:style/Theme\.Light[A-Za-z.]*"#parent="Theme.AppCompat.Light.NoActionBar"#' \
            -e 's#parent="@android:style/Theme\.DeviceDefault\.Light[A-Za-z.]*"#parent="Theme.AppCompat.Light.NoActionBar"#' \
            -e 's#parent="@android:style/Theme\.Black[A-Za-z.]*"#parent="Theme.AppCompat.NoActionBar"#' \
            -e 's#parent="@android:style/Theme\.DeviceDefault[A-Za-z.]*"#parent="Theme.AppCompat.NoActionBar"#' {} +
          grep -rn "parent=" android/app/src/main/res --include=styles.xml || true
          grep -n "USE_BIOMETRIC\|enableOnBackInvokedCallback" "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      # بعض الإضافات مبنية على compileSdk أقدم من 36 بينما تتطلب مكتبات Flutter الحديثة 36
      - name: Raise compileSdk of plugins below 36
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE/hosted" -path '*/android/build.gradle' -not -path '*/example/*' | while read -r f; do
            sed -i -E 's/compileSdk(Version)?[ =(]+(2[0-9]|3[0-5])\)?/compileSdk 36/' "$f"
          done
          find "$CACHE/hosted" -path '*/android/build.gradle.kts' -not -path '*/example/*' | while read -r f; do
            sed -i -E 's/compileSdk(Version)? *=? *\(?(2[0-9]|3[0-5])\)?/compileSdk = 36/' "$f"
          done
          grep -rn "compileSdk" "$CACHE"/hosted/pub.dev/*/android/build.gradle* 2>/dev/null | grep -v example | head -40 || true

      # تعطّل فاحص lint داخل image_picker_android بخطأ داخلي في الأداة نفسها (ليس في الكود)
      - name: Disable lintVital tasks
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'KTS'

          subprojects {
              tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false }
          }
          KTS
          elif [ -f android/build.gradle ]; then
            cat >> android/build.gradle <<'GRADLE'

          subprojects {
              tasks.matching { it.name.startsWith('lintVital') }.configureEach { enabled = false }
          }
          GRADLE
          fi
          tail -6 android/build.gradle* 2>/dev/null || true

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inventory-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
